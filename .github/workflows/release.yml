name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: [self-hosted, linux, external-k8s]
    env:
      pypi_user: ${{ secrets.SAS_PYPI_USER }}
      pypi_password: ${{ secrets.SAS_PYPI_PASSWORD }}
      ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build uv

      - name: Fail early if changelog is not ready
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")

          m = re.search(
              r"^##\s+([^\n]+?)\s+\(unreleased\)\s*$([\s\S]*?)(?=^##\s+|\Z)",
              text,
              re.MULTILINE,
          )
          if not m:
              sys.exit("CHANGELOG.md must contain a top unreleased section like: ## <version> (unreleased)")

          version = m.group(1).strip()
          body = m.group(2).strip()

          bullets = [
              line.strip()
              for line in body.splitlines()
              if line.strip().startswith("-")
          ]

          meaningful = [
              line for line in bullets
              if "nothing changed yet" not in line.lower()
          ]

          if not meaningful:
              sys.exit(
                  f"CHANGELOG.md unreleased section for {version} has no real change entry."
              )

          print(f"Changelog OK for unreleased version: {version}")
          PY

      - name: Configure git identity
        run: |
          git config --global user.email "brent.elmer@bayer.com"
          git config --global user.name "webe3"

      - name: Configure package index
        run: |
          cat > ~/.pypirc <<EOF
          [distutils]
          index-servers =
              saspypi

          [saspypi]
          repository = https://pypi.science-at-scale.io
          username = $pypi_user
          password = $pypi_password
          EOF

      - name: Run release
        env:
          TWINE_SKIP_EXISTING: "no"
        run: |
          uvx --from zest.releaser fullrelease --no-input

      - name: Build local dists for Artifactory
        run: |
          python -m build --sdist --wheel --outdir dist/

      - name: Upload to JFrog Artifactory
        run: |
          for file in dist/*; do
            echo "Uploading $file to Artifactory..."
            curl -u "$ARTIFACTORY_USER:$ARTIFACTORY_PASSWORD" \
              -T "$file" \
              "https://artifactory.bayer.com/artifactory/scn-pypi-prod-scsa/na_ss2/$(basename "$file")"
          done